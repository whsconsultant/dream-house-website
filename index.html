<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Dream House — duplex penthouse, built layer by layer." />
    <title>Dream House</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600&family=Fraunces:opsz,wght@9..144,600&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="app">
      <canvas id="scene"></canvas>
      <div class="plan-meta"></div>
      <div class="plan-tabs" role="tablist" aria-label="Floor plans">
        <button type="button" class="plan-tabs__btn is-active" data-plan="both">All</button>
        <button type="button" class="plan-tabs__btn" data-plan="l1">Level 1</button>
        <button type="button" class="plan-tabs__btn" data-plan="l2">Level 2</button>
        <button type="button" class="plan-tabs__btn" data-plan="l3">Roof</button>
      </div>
      <div class="layer-badge">Layer 2 · Plan</div>
    </div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
