<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Walk through a 12,400 sq ft full-floor penthouse — glass curtain walls, infinity pool terrace, and skyline views."
    />
    <title>Dream House — Full-Floor Penthouse</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,500;0,9..40,600;1,9..40,400&family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="app">
      <canvas id="scene"></canvas>

      <div id="landing" class="landing">
        <div class="landing__veil"></div>
        <div class="landing__content">
          <p class="landing__meta">Residence · Floor 47 · Full Floor</p>
          <h1 class="landing__brand">Dream House</h1>
          <p class="landing__tagline">
            A 12,400 sq ft glass penthouse above the city — living, dining,
            spa wing, and an infinity terrace that wraps the skyline.
          </p>
          <div class="landing__actions">
            <button type="button" id="enter-btn" class="btn btn--primary">
              Enter the penthouse
            </button>
            <button type="button" id="orbit-btn" class="btn btn--ghost">
              Orbit view
            </button>
          </div>
        </div>
        <div class="landing__hint">Scroll or click to begin</div>
      </div>

      <div id="hud" class="hud is-hidden" aria-hidden="true">
        <header class="hud__top">
          <div class="hud__brand">Dream House</div>
          <div id="room-label" class="hud__room">Foyer</div>
        </header>

        <nav class="hud__rooms" id="room-nav" aria-label="Rooms"></nav>

        <footer class="hud__controls">
          <span><kbd>W</kbd><kbd>A</kbd><kbd>S</kbd><kbd>D</kbd> move</span>
          <span><kbd>Mouse</kbd> look</span>
          <span><kbd>E</kbd> next room</span>
          <span><kbd>Esc</kbd> release</span>
          <button type="button" id="mode-btn" class="btn btn--tiny">Orbit</button>
        </footer>
      </div>

      <div id="crosshair" class="crosshair is-hidden" aria-hidden="true"></div>
    </div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
